      <stop offset="0" stop-color="#272F50"/><stop offset="0.52" stop-color="#272F50"/><stop offset="1" stop-color="#43282D"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#272F50"/>
      <stop offset="0.16" stop-color="#B8DDE8"/>
      <stop offset="0.26" stop-color="#FAF3E8"/>
      <stop offset="0.34" stop-color="#EABAC9"/>
      <stop offset="0.48" stop-color="#B52B53"/>
      <stop offset="0.60" stop-color="#43282D"/>
      <stop offset="0.72" stop-color="#D5A22F"/>
      <stop offset="0.84" stop-color="#F3D88F"/>
      <stop offset="0.96" stop-color="#B8DDE8"/>
