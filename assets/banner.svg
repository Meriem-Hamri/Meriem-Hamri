<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Meriem Hamri - Build with intention">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a38"/>
      <stop offset="0.6" stop-color="#1d2250"/>
      <stop offset="1" stop-color="#3a1f3d"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a6fc9" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#b8325a"/>
      <stop offset="1" stop-color="#e8b84b"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fd6e6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f4c6d8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f7e3a1"/>
    </linearGradient>
    <clipPath id="type">
      <rect x="60" y="100" height="80" width="0">
        <animate attributeName="width" from="0" to="640" dur="2.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle cx="120" cy="40" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="250" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="45" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="265" r="1.3"><animate attributeName="opacity" values="1;0.1;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="60" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="230" r="1.7"><animate attributeName="opacity" values="1;0.1;1" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- floating ribbons -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -30,12; 0,0" dur="9s" repeatCount="indefinite"/>
      <path d="M1250,-20 C1050,60 980,200 780,260 C700,285 640,300 560,330 L1250,330 Z" fill="url(#ribbon)" opacity="0.85"/>
      <path d="M1250,-40 C1100,40 1000,150 850,215 C760,255 700,290 620,330" fill="none" stroke="url(#ribbon2)" stroke-width="5" stroke-linecap="round"/>
      <path d="M1250,10 C1120,70 1040,170 900,225 C830,252 780,280 720,320" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 10">
        <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- frame -->
    <rect x="22" y="22" width="1156" height="256" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>

    <text x="60" y="68" font-family="'Courier New', monospace" font-size="15" letter-spacing="5" fill="#9aa3e6">MH / SOFTWARE ENGINEERING</text>

    <g clip-path="url(#type)">
      <text x="60" y="165" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#ffffff">Build with intention.</text>
    </g>

    <text x="60" y="215" font-family="'Courier New', monospace" font-size="15" letter-spacing="4" fill="#e8b84b" opacity="0">
      ARCHITECTURE / CRAFT / EXPERIENCE
      <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.8s" fill="freeze"/>
    </text>

    <!-- blinking cursor dot -->
    <circle cx="64" cy="252" r="3.5" fill="#e8b84b">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1140" y="258" text-anchor="end" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#f7e3a1">2026</text>
  </g>
</svg>
